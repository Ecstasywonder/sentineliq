openapi: "3.1.0"
info:
  title: Get Event Detail
  version: "1.0"
  description: >
    Retrieve the full metadata record for a SentinelIQ security event.
    The Context Agent uses this to confirm event fields (type, timestamp,
    location, zone, camera_id, detector_confidence) before interpreting
    evidence gathered for that event.

paths:
  /tools/event-detail:
    get:
      operationId: get_event_detail
      summary: Retrieve full metadata for a security event.
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: SentinelIQ event UUID.
      responses:
        "200":
          description: Full event metadata record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                  event_type:
                    type: string
                  event_timestamp:
                    type: string
                    format: date-time
                  location_id:
                    type: string
                  facility_id:
                    type: string
                  camera_id:
                    type: string
                  zone:
                    type: string
                  detector_confidence:
                    type: number
                    format: float
                  status:
                    type: string
        "404":
          description: Event not found.
