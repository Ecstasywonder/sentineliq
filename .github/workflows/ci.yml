name: SentinelIQ CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# - Every push runs the full suite, including ad-hoc repair branches.
# - Every PR targeting main is required to pass before merge.
# - Merge to main is only allowed via PR — direct pushes are blocked
#   by the GitHub branch-protection rule documented in docs/deployment.md.
# ---------------------------------------------------------------------------
on:
  push:
  pull_request:
    branches: [main]

# Keep the workflow token read-only. The secret-scan job adds read-only PR
# metadata access for selecting the pull-request commit range.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint, format, type-check, tests, coverage
  # This job is declared as REQUIRED in the GitHub branch-protection rule.
  # No merge to main is possible if this job fails.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Keep the resolver itself reproducible.  Application dependency ranges
      # are audited below until the project adopts a committed uv.lock.
      - name: Install uv
        run: pip install --disable-pip-version-check "uv==0.13.7"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Audit Python dependencies
        # Snapshot the application environment before installing the auditor,
        # so the auditor's own transitive dependencies are not mistaken for
        # application dependencies.
        run: |
          uv pip install --system "setuptools==84.1.0"
          python -m pip freeze --exclude-editable > /tmp/pip-audit-requirements.txt
          uv pip install --system "pip-audit==2.9.0"
          pip-audit --strict --requirement /tmp/pip-audit-requirements.txt --format json --output /tmp/pip-audit-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pip-audit-report.json").read_text())
          dependencies = report["dependencies"]
          if not dependencies:
              raise SystemExit("Python dependency audit did not inspect any distributions")
          skipped = [dependency for dependency in dependencies if "skip_reason" in dependency]
          if skipped:
              raise SystemExit(f"Unexpected unaudited Python distributions: {skipped}")
          PY

      - name: Lint — ruff check
        run: ruff check app/ tests/

      - name: Format check — ruff format
        run: ruff format --check app/ tests/

      - name: Type check — mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true   # advisory until stubs are complete (Gate 31)

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=85
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.6.0
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true   # non-blocking; coverage gate enforced above

  # ---------------------------------------------------------------------------
  # Frontend — type-check, lint, unit tests, build
  # The frontend scaffold is part of the repository and is validated on every run.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        # The gate blocks HIGH and CRITICAL findings in both runtime and build
        # dependencies.  Lower severities are tracked for remediation rather
        # than blocking routine delivery.
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Security — full-history secret scanning (gitleaks)
  # ---------------------------------------------------------------------------
  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The action reads PR commit metadata to select the scan range. It does not
    # need write access because inline PR comments are disabled below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history required for accurate scan

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ---------------------------------------------------------------------------
  # Container supply chain — build the exact production Dockerfiles and scan
  # their OS and language packages.  This is deliberately separate from the
  # application jobs so a vulnerable deployable image cannot be hidden by
  # passing source-level checks.
  # ---------------------------------------------------------------------------
  container-security:
    name: Container security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Build backend production image
        run: docker build --pull --tag sentineliq-backend:ci -f infra/docker/Dockerfile.backend backend

      - name: Scan backend production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentineliq-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Build frontend production image
        run: docker build --pull --tag sentineliq-frontend:ci -f infra/docker/Dockerfile.frontend frontend

      - name: Scan frontend production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentineliq-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          vuln-type: os,library

  # ---------------------------------------------------------------------------
  # Gate guard — aggregate required job
  # This is the single status check to register in branch protection. It
  # represents every configured quality gate, not only the backend job.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate (required for merge)
    needs: [backend, frontend, security, container-security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.container-security.result }}" != "success" ]; then
            echo "One or more required CI jobs failed or were cancelled — merge blocked."
            exit 1
          fi
          echo "✅ All required checks passed — merge allowed."
