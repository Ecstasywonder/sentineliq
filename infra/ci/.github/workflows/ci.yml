name: SentinelIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint, type check, tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Install aiosqlite (test DB)
        run: uv pip install --system aiosqlite

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports
        continue-on-error: true  # non-blocking until stubs are complete

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_URL_SYNC: sqlite:///:memory:

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Frontend — lint, type check, build, tests
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Security — secret scanning
  # ---------------------------------------------------------------------------
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # non-blocking in MVP; must be fixed before production
