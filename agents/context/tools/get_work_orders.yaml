openapi: "3.1.0"
info:
  title: Get Work Orders
  version: "1.0"
  description: >
    Check whether any active work orders authorise maintenance or contractor
    access to the specified location at the time of the security event.

paths:
  /tools/work-orders:
    get:
      operationId: get_work_orders
      summary: Retrieve active work orders for an event location.
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: SentinelIQ event UUID.
        - name: location_id
          in: query
          required: true
          schema:
            type: string
          description: Location or facility identifier.
      responses:
        "200":
          description: Active work orders for the location and time window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                    example: mock_work_order
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        work_order_id:
                          type: string
                        assigned_to:
                          type: string
                        valid_from:
                          type: string
                          format: date-time
                        valid_to:
                          type: string
                          format: date-time
                        location_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      record_count:
                        type: integer
        "503":
          description: Work-order system unavailable.
