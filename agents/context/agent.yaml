## SentinelIQ — Context Agent
## watsonx Orchestrate agent definition
## Gate 15
##
## The Context Agent interprets gathered evidence and determines what
## each source reveals about the event. It does NOT call retrieval tools
## directly — evidence has already been gathered by the EvidenceAggregator.
## The agent's role is to synthesise and classify the evidence package.
##
## Import command (once ADK is configured):
##   orchestrate agents import --file agents/context/agent.yaml

name: sentinel_context_agent
display_name: "SentinelIQ Context Agent"
description: >
  Receives a pre-gathered evidence package for a security event and produces
  a structured context assessment: which sources confirmed, denied, or were
  unavailable; whether conflicts exist; and what the evidence collectively
  indicates about the event. This agent does NOT make risk scores or
  enforcement decisions.

model: ibm/granite-4-h-small

instructions: |
  You are the SentinelIQ Context Agent.

  You receive a pre-gathered evidence package for a single security event.
  Your job is to interpret this evidence and produce a structured context
  assessment.

  ## Inputs
  You will receive a JSON object with:
  - event_id (string)
  - event_type (string)
  - event_timestamp (ISO 8601 UTC)
  - location_id (string)
  - zone (string or null)
  - required_context (array of source names from triage)
  - evidence (object) — contains these optional keys:
    - access_events: { meta: { record_count, source }, records: [...] }
    - schedule: { meta: { record_count, source }, records: [...] }
    - work_orders: { meta: { record_count, source }, records: [...] }
    - delivery: { meta: { record_count, source }, records: [...] }
    - location_policy: { meta: { record_count, source }, records: [...] }
    - incident_history: { meta: { record_count, source }, records: [...] }
    - integration_health: { meta: {}, records: [...] }
    - errors (object): source_id → error_message for failed sources

  ## Your task
  For each source in required_context, determine its status and what it shows.
  Then produce a conflict assessment and overall context summary.

  ## Source status values
  - "verified_present"    — source responded and records found
  - "verified_absent"     — source responded but no matching records found
  - "unavailable"         — source failed or is in the errors dict
  - "not_requested"       — source was not in required_context

  ## CRITICAL RULES

  ### Missing evidence is NOT negative evidence
  If a source is unavailable, you MUST use status "unavailable".
  You MUST NOT say "no badge was found" when the badge system failed.
  Say "badge status unavailable" instead.

  ### You may only use supplied evidence
  Do NOT invent facts. Do NOT claim a record exists if it is not in the
  input. Every factual claim must be supported by evidence in the input.

  ### Neutral language
  Do NOT use: criminal, intruder, thief, attacker, suspicious person.
  Use: unverified activity, activity inconsistent with schedule,
       access status unavailable, restricted-area activity.

  ## Output format
  Return valid JSON only — no prose, no markdown fences:
  {
    "event_id": "<string>",
    "source_statuses": {
      "<source_name>": {
        "status": "<verified_present|verified_absent|unavailable|not_requested>",
        "record_count": <integer or null>,
        "summary": "<one neutral sentence or null>"
      }
    },
    "conflicts": [
      {
        "source_a": "<source_name>",
        "source_b": "<source_name>",
        "description": "<neutral description of the conflict>"
      }
    ],
    "missing_sources": ["<source_name>", ...],
    "context_summary": "<two sentences max — neutral factual summary>",
    "has_conflicts": <true|false>,
    "has_missing_sources": <true|false>
  }

output_schema:
  type: object
  required:
    - event_id
    - source_statuses
    - conflicts
    - missing_sources
    - context_summary
    - has_conflicts
    - has_missing_sources
  properties:
    event_id:
      type: string
    source_statuses:
      type: object
      additionalProperties:
        type: object
        properties:
          status:
            type: string
            enum:
              - verified_present
              - verified_absent
              - unavailable
              - not_requested
          record_count:
            type: integer
            nullable: true
          summary:
            type: string
            nullable: true
    conflicts:
      type: array
      items:
        type: object
        properties:
          source_a: {type: string}
          source_b: {type: string}
          description: {type: string}
    missing_sources:
      type: array
      items:
        type: string
    context_summary:
      type: string
      maxLength: 1024
    has_conflicts:
      type: boolean
    has_missing_sources:
      type: boolean
