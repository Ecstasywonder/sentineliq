openapi: "3.1.0"
info:
  title: Get Location Policy
  version: "1.0"
  description: >
    Retrieve security rules and zone classifications that apply to the event
    location. Includes after-hours restrictions, access restrictions, and
    restricted-zone designations.

paths:
  /tools/location-policy:
    get:
      operationId: get_location_policy
      summary: Retrieve security rules for an event location.
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: SentinelIQ event UUID.
        - name: location_id
          in: query
          required: true
          schema:
            type: string
          description: Zone or location identifier.
      responses:
        "200":
          description: Active security rules for the location.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                    example: db_security_rules
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id:
                          type: string
                        rule_type:
                          type: string
                          enum:
                            - after_hours_restriction
                            - access_restriction
                            - restricted_zone
                            - general_policy
                        is_active:
                          type: boolean
                        description:
                          type: string
                  meta:
                    type: object
                    properties:
                      record_count:
                        type: integer
        "503":
          description: Security rules database unavailable.
