server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend is not publicly exposed by this route.  The browser uses
    # its own origin (/api/v1), and Nginx resolves the Docker-only hostname.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support direct navigation to client-side routes without proxying misses
    # to the backend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
