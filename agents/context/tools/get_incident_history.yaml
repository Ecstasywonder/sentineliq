openapi: "3.1.0"
info:
  title: Get Incident History
  version: "1.0"
  description: >
    Retrieve prior incident records for the event location or facility.
    A history of prior incidents at a location is a relevant risk factor
    (known_incident_area). The agent must not infer guilt from history alone.

paths:
  /tools/incident-history:
    get:
      operationId: get_incident_history
      summary: Retrieve prior incidents at the event location.
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: SentinelIQ event UUID.
        - name: location_id
          in: query
          required: false
          schema:
            type: string
          description: Location to search for prior incidents.
        - name: facility_id
          in: query
          required: false
          schema:
            type: string
          description: Facility to search (used if location_id not provided).
      responses:
        "200":
          description: Prior incidents at the specified location/facility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                    example: db_incident_history
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        incident_id:
                          type: string
                        occurred_at:
                          type: string
                          format: date-time
                        incident_type:
                          type: string
                        location_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      record_count:
                        type: integer
        "503":
          description: Incident history database unavailable.
