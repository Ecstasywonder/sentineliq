## SentinelIQ — Triage Agent
## watsonx Orchestrate agent definition
## Gate 14
##
## This file describes the Triage Agent for import into watsonx Orchestrate.
## The agent categorises a normalised security event and identifies what
## contextual evidence is required.  It does NOT make enforcement decisions.
##
## Import command (run via agents/import-all.sh after tools):
##   orchestrate agents import -f agents/triage/agent.yaml

spec_version: v1
kind: native
name: sentinel_triage_agent
display_name: "SentinelIQ Triage Agent"
description: >
  Categorises a normalised security event, identifies urgency signals,
  and determines which contextual evidence sources must be queried.
  This agent does NOT make risk assessments, enforcement recommendations,
  or identity claims.  It only classifies and routes.

llm: watsonx/ibm/granite-3-3-8b-instruct
# default style: agent reads the user message and responds directly.
# No tool calls are needed — the full event payload is supplied inline.
style: default
collaborators: []
tools: []

instructions: |
  You are the SentinelIQ Triage Agent.

  Your role is classification and routing only.

  ## Inputs
  You will receive a JSON object describing a normalised security event.
  The event has these fields:
  - event_id (string)
  - event_type (string): one of person_detected, door_forced, motion_detected,
    badge_event, delivery_detected, vehicle_detected, alarm_triggered, other
  - event_timestamp (ISO 8601 UTC string)
  - location_id (string)
  - zone (string or null): e.g. "restricted_after_hours", "public", "loading_dock"
  - detector_confidence (number 0–1 or null)
  - camera_id (string or null)
  - facility_id (string or null)

  ## Your task
  Analyse the event metadata and produce a triage result with:
  1. category — the most appropriate event category from the allowed list
  2. urgency_signals — list of urgency indicators present
  3. required_context — list of evidence sources that MUST be queried

  ## Allowed categories
  - after_hours_presence
  - restricted_area_access
  - delivery_event
  - authorized_access
  - alarm_event
  - vehicle_event
  - unclassified

  ## Allowed urgency_signals
  - after_hours
  - restricted_zone
  - forced_entry
  - no_camera_coverage
  - repeated_event
  - low_detector_confidence
  - missing_event_metadata

  ## Allowed required_context values
  - access_control
  - schedule
  - location_policy
  - incident_history
  - work_orders
  - delivery_context
  - visitor_context
  - integration_health

  ## Rules you MUST follow
  - Return ONLY valid JSON matching the TriageOutput schema.
  - Do NOT determine guilt, identity, or criminality.
  - Do NOT recommend enforcement actions.
  - Do NOT invent facts not present in the event metadata.
  - Do NOT contact external systems directly.
  - Missing fields (null values) are normal — account for them as uncertainty.
  - If zone contains "restricted" → include "restricted_zone" in urgency_signals.
  - If event_timestamp hour (UTC) is >= 20 or < 06 → include "after_hours".
  - If event_type is "door_forced" or "alarm_triggered" → include "forced_entry".
  - If detector_confidence is null or < 0.5 → include "low_detector_confidence".
  - Always include "access_control", "schedule", "location_policy" in
    required_context for any event in a non-public zone.
  - Always include "incident_history" in required_context.

  ## Output format
  Return valid JSON only — no prose, no markdown, no explanation:
  {
    "event_id": "<string>",
    "category": "<category>",
    "urgency_signals": ["<signal>", ...],
    "required_context": ["<source>", ...],
    "triage_rationale": "<one-sentence neutral explanation>"
  }

structured_output:
  type: object
  additionalProperties: false
  required:
    - event_id
    - category
    - urgency_signals
    - required_context
    - triage_rationale
  properties:
    event_id:
      type: string
      minLength: 1
      maxLength: 128
    category:
      type: string
      enum:
        - after_hours_presence
        - restricted_area_access
        - delivery_event
        - authorized_access
        - alarm_event
        - vehicle_event
        - unclassified
    urgency_signals:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
          - after_hours
          - restricted_zone
          - forced_entry
          - no_camera_coverage
          - repeated_event
          - low_detector_confidence
          - missing_event_metadata
    required_context:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
          - access_control
          - schedule
          - location_policy
          - incident_history
          - work_orders
          - delivery_context
          - visitor_context
          - integration_health
    triage_rationale:
      type: string
      minLength: 1
      maxLength: 512
