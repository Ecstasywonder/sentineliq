openapi: "3.1.0"
info:
  title: Get Delivery Context
  version: "1.0"
  description: >
    Check whether any deliveries are expected at the facility during the event
    window. Delivery slots can legitimately explain after-hours access.

paths:
  /tools/delivery-context:
    get:
      operationId: get_delivery_context
      summary: Retrieve scheduled deliveries for a facility and time window.
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          description: SentinelIQ event UUID.
        - name: facility_id
          in: query
          required: false
          schema:
            type: string
          description: Facility identifier (defaults to event's facility).
      responses:
        "200":
          description: Expected deliveries covering the event time window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                    example: mock_delivery
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        delivery_id:
                          type: string
                        carrier:
                          type: string
                        expected_at:
                          type: string
                          format: date-time
                        facility_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      record_count:
                        type: integer
        "503":
          description: Delivery system unavailable.
